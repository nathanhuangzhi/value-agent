[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "value-agent"
version = "0.1.0"
description = "Munger-style value-investing research agent (FastAPI + DeepSeek + yfinance pipeline)."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "openai",
    "exa-py",
    "yfinance",
    "python-dotenv",
    "pydantic",
    "PyYAML",
    "requests",
    "httpx",
    "uvicorn",
    "pandas",
    "matplotlib",
    "markdown-it-py",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]
exclude = ["data*", "venv*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Coverage floor enforces that the test suite doesn't silently regress.
# Raise gradually as more modules are covered; the CI command is:
#   ./venv/bin/pytest --cov=app --cov-fail-under=70
# Not in addopts (default) so plain `pytest -q` stays fast.

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["data", "venv", "build"]

[tool.ruff.lint]
# Conservative starter set — bump the E/F/W defaults and add a few easy wins
# (unused imports, comprehension flags, naming). Expand as the codebase
# tolerates it.
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line-length is enforced by formatter, not linter
    "E402",  # module-level imports below top — three scripts intentionally
             # call load_dotenv() before importing modules that read env vars
    "B008",  # FastAPI uses function defaults like `= Depends(...)`
]

[tool.ruff.lint.per-file-ignores]
# Tests can use bare asserts + magic numbers freely.
"tests/**" = ["B011", "E712"]
# format.py has aligned single-line `if a >= 1e9: return ...` ladders — the
# vertical alignment is the point; reformatting hurts readability.
"app/tools/report/format.py" = ["E701"]
# tables.py uses lambdas as inline cell-formatters in a row table; rewriting
# as `def` would explode the table layout without expressive gain.
"app/tools/report/tables.py" = ["E731"]

[tool.mypy]
python_version = "3.10"
# Start permissive so we can land config without rewriting the world.
# Tighten file-by-file once the easy wins are clean.
files = ["app", "scripts"]
explicit_package_bases = true   # `app.tools.report.format` vs `report.format`
ignore_missing_imports = true   # yfinance, exa_py, etc. have no stubs
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
# Per-module strictness can be raised incrementally:
#   [[tool.mypy.overrides]]
#   module = "app.tools.json_io"
#   disallow_untyped_defs = true
